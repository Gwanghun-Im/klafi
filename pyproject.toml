[project]
name = "klafi"
version = "0.1.5"
description = "KLAFI — Enterprise Agentic AI Engineering Framework"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2",
    "pyyaml>=6",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "fastapi>=0.110", # Agent Server(HTTP, §19 F13)가 핵심 기능이라 코어. 실행기(uvicorn)는 앱이 고름
    "grandalf>=0.8",
]

[project.optional-dependencies]
server = ["fastapi>=0.110"]     # 하위호환 alias — fastapi 는 이미 코어라 no-op(기존 klafi[server] 유지)
openai = ["openai>=1.0", "langchain-openai>=0.2"]
anthropic = ["anthropic>=0.40", "langchain-anthropic>=0.2"]
mcp = ["langchain-mcp-adapters>=0.1"]                    # MCP 외부 도구 연결 (connect_mcp)
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.20"]  # OTLP trace 송출 (resolve_otlp_exporter)

[dependency-groups]
dev = [  # uv sync 기본 포함 — venv 재동기화 시 테스트 의존성이 사라지지 않게 명시
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "langgraph-checkpoint-postgres>=2",  # postgres 체크포인터/스토어 경로 테스트
    "uvicorn[standard]>=0.30",  # examples/support_platform 을 저장소 venv 로 바로 띄우기 위함(실행기는 앱이 고르는 설계라 코어엔 없음)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klafi"]
