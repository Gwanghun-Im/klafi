[project]
name = "klafi"
version = "0.1.0"
description = "KLAFI — Enterprise Agentic AI Engineering Framework"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2",
    "pyyaml>=6",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.optional-dependencies]
server = ["fastapi>=0.110"]
openai = ["openai>=1.0", "langchain-openai>=0.2"]
anthropic = ["anthropic>=0.40", "langchain-anthropic>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klafi"]
