<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KLAFI Chat</title>
<style>
  /* Material Design 3 다크 baseline 토큰 — 컴포넌트 라이브러리 없이 CSS 만으로 MD3 look.
     (오프라인/사내망 안전: 외부 CDN·폰트 로드 없음. Roboto 는 설치돼 있으면 집는다.) */
  :root { --bg:#141218; --panel:#211F26; --panel-hi:#2B2930; --panel-max:#36343B;
          --line:#49454F; --fg:#E6E0E9; --muted:#CAC4D0;
          --accent:#D0BCFF; --on-accent:#381E72; --accent-ctr:#4F378B; --on-accent-ctr:#EADDFF;
          --bad:#F2B8B5; --bad-ctr:#8C1D18; --on-bad-ctr:#F9DEDC;
          --warn:#FFD8A8; --warn-bg:#2A2117; --ok:#6DD58C;
          --scroll:#49454F; --scroll-hover:#938F99; }
  * { box-sizing:border-box; }
  /* 스크롤바 — OS 기본은 다크 배경에서 밝게 튄다. 얇고 어둡게, 호버 시에만 또렷하게. */
  * { scrollbar-width:thin; scrollbar-color:var(--scroll) transparent; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:8px;
    border:2px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover { background:var(--scroll-hover); background-clip:content-box; }
  ::-webkit-scrollbar-corner { background:transparent; }
  html, body { height:100%; margin:0; }
  body { font:14px/1.5 Roboto,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--fg); display:flex; flex-direction:column; }
  /* Top app bar — surface-container, 구분선 대신 면 색으로 층을 만든다(MD3 방식) */
  header { padding:10px 16px; background:var(--panel); display:flex; gap:10px;
           align-items:center; flex-wrap:wrap; }
  header .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
  header .dot.up { background:var(--ok); } header .dot.down { background:var(--bad); }
  header b { font-size:15px; font-weight:500; letter-spacing:.2px; }
  header .sp { flex:1; }
  select, input, textarea { font:inherit; color:var(--fg); background:var(--panel-hi);
           border:1px solid transparent; border-radius:12px; padding:8px 12px; }
  header input { width:96px; } header select { min-width:150px; }
  :is(select,input,textarea):focus-visible { outline:2px solid var(--accent); outline-offset:-1px; }
  /* 버튼 공통 = MD3 pill(fully rounded) + hover state layer(brightness ≈ 8% 레이어) */
  button { font:inherit; cursor:pointer; border:none; border-radius:20px; padding:8px 16px;
           color:var(--fg); background:var(--panel-hi); }
  button:hover:not(:disabled) { filter:brightness(1.12); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button.icon { background:transparent; color:var(--muted); }
  button.icon:hover:not(:disabled) { background:var(--panel-hi); filter:none; }
  a { color:var(--accent); text-decoration:none; }

  #log { flex:1; overflow-y:auto; padding:20px 16px 8px; display:flex; flex-direction:column; gap:14px;
         max-width:860px; width:100%; margin:0 auto; }
  .msg { display:flex; gap:10px; max-width:82%; }
  .msg .av { width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center;
             font-size:14px; background:var(--panel-hi); }
  /* 말풍선 — MD3 shape: 20px, 화자 쪽 꼬리만 4px. 컨테이너 색으로 구분(테두리 없음). */
  .msg .bubble { padding:10px 14px; border-radius:20px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .msg.user .bubble { background:var(--accent-ctr); color:var(--on-accent-ctr); border-bottom-right-radius:4px; }
  .msg.bot .bubble { background:var(--panel-hi); border-bottom-left-radius:4px; }
  .msg.err .bubble { background:var(--bad-ctr); color:var(--on-bad-ctr); }
  .msg .who { font-size:11px; color:var(--muted); margin:0 0 3px; }
  /* MD3 assist chip */
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .chip { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:2px 10px; }
  details { margin-top:6px; } summary { font-size:11px; color:var(--muted); cursor:pointer; }
  details pre { margin:6px 0 0; background:var(--bg); border:1px solid var(--line); border-radius:12px;
                padding:10px; overflow:auto; font-family:ui-monospace,Menlo,monospace; font-size:12px; }

  /* HITL 카드 — elevated card(16px). pre-wrap 이면 innerHTML 템플릿 줄바꿈이 그대로 렌더돼 세로로 늘어난다. */
  .hitl { background:var(--warn-bg) !important; border-radius:16px !important; white-space:normal !important;
          box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .hitl .head { color:var(--warn); font-weight:500; margin-bottom:6px; }
  .hitl .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .hitl input { flex:1; min-width:140px; background:var(--panel-hi); }
  .fields { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:8px 0; }
  .fld { display:contents; } .fld .k { color:var(--muted); } .fld .v { word-break:break-word; }
  /* MD3: 확정 = filled(primary), 파괴적 = error tonal */
  button.ok { background:var(--accent); color:var(--on-accent); font-weight:500; }
  button.no { background:var(--bad-ctr); color:var(--on-bad-ctr); font-weight:500; }
  .done { font-size:11px; color:var(--muted); margin-top:8px; }
  .streamerr { color:var(--bad); margin-top:8px; }

  /* Composer — 검색바 스타일 pill 입력 + filled 주 액션. align-items:flex-end — stretch 면
     입력이 여러 줄로 늘 때 버튼까지 같이 커진다. */
  form#composer { padding:12px 16px 16px; display:flex; gap:8px;
                  align-items:flex-end; max-width:860px; width:100%; margin:0 auto; }
  #composer textarea { flex:1; resize:none; max-height:140px; overflow-y:hidden; line-height:1.5;
                       border-radius:24px; padding:10px 16px; }
  /* 세로 패딩으로 자체 높이를 갖게 해 stretch 에 의존하지 않는다. */
  #composer button { padding:10px 18px; font-weight:500; white-space:nowrap; }
  #composer button#send { background:var(--accent); color:var(--on-accent); }
  /* 보조 액션은 text button — 주 액션(Invoke)이 먼저 읽히게 한다. */
  #composer button#stream, #composer button#resume { background:transparent; color:var(--muted); }
  #composer button#stream:hover:not(:disabled), #composer button#resume:hover:not(:disabled)
    { background:var(--panel-hi); color:var(--fg); filter:none; }
  #composer button#stop { background:var(--bad-ctr); color:var(--on-bad-ctr); }
  button:disabled { opacity:.45; cursor:not-allowed; }  /* composer·HITL(.ok/.no) 공통 — 눌린 뒤 비활성 표시 */
  .typing .bubble::after { content:"▋"; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <b>KLAFI Chat</b>
  <select id="agent" title="에이전트"></select>
  <span class="muted" id="hint"></span>
  <span class="sp"></span>
  <label class="muted" style="display:flex;gap:6px;align-items:center">X-User <input id="xuser" value="u1"></label>
  <button class="icon" id="newchat" title="새 대화(스레드 초기화)">＋ 새 대화</button>
  <a href="/docs" target="_blank" class="muted">Swagger</a>
</header>

<div id="log"></div>

<form id="composer">
  <textarea id="text" rows="1" placeholder="메시지를 입력하세요…"></textarea>
  <button type="submit" id="send" title="Invoke — 한 번에 응답">Invoke</button>
  <button type="button" id="stream" title="Stream — NDJSON 청크 스트리밍">Stream</button>
  <button type="button" id="resume" title="Resume — 중단된 스레드 재개(텍스트=사유, 비우면 승인)">Resume</button>
  <button type="button" id="stop" title="진행 중인 스트림 중지" hidden>중지</button>
</form>

<script>
const $ = s => document.querySelector(s);
const rnd = () => Math.random().toString(36).slice(2, 8);
const log = $("#log");
// 세션(대화)은 thread_id로 갈린다. 유저별로 독립 세션이 되도록 thread를 유저에 묶고,
// 에이전트도 포함한다 — 체크포인터는 thread_id만으로 키를 잡으므로, 스키마가 다른 그래프가
// 같은 thread를 공유하면 서로의 상태를 덮어써 대기 중인 승인(interrupt)이 소실된다.
let threadBase = "t-" + rnd();
const userId = () => $("#xuser").value.trim() || "anon";
const thread = () => `${userId()}:${$("#agent").value}:${threadBase}`;

// 동시 요청 방지 — 서버 concurrency 상한(429)과 말풍선 뒤섞임을 막는다. 스트림은 중지 가능.
let busy = false, aborter = null;
function setBusy(on, abortable = false) {
  busy = on;
  ["#send", "#stream", "#resume"].forEach(s => { $(s).disabled = on; });
  $("#stop").hidden = !(on && abortable);
}

const HINTS = { stock: "예: AAPL 10  (종목 수량)", default: "" };
const setHint = () => { $("#hint").textContent = HINTS[$("#agent").value] || HINTS.default;
  $("#text").placeholder = $("#agent").value === "stock" ? "예: AAPL 10" : "메시지를 입력하세요…"; };

const headers = () => { const h = {"Content-Type":"application/json"}; const u = $("#xuser").value.trim();
  if (u) h["X-User"] = u; return h; };
// 네트워크 장애도 status 0으로 정규화 — throw로 새어나가면 typing 말풍선이 영구히 남는다.
// 연결 dot 은 매 요청 결과로 갱신한다(boot 1회 판정이면 이후 서버가 죽어도 초록으로 남는다).
async function api(path, opts={}) {
  let res;
  try { res = await fetch(path, {headers: headers(), ...opts}); }
  catch (e) { $("#dot").className = "dot down";
    return {status: 0, body: {error: "서버에 연결할 수 없습니다 (" + (e.message || "network") + ")"}}; }
  $("#dot").className = "dot up";
  const t = await res.text(); let body; try { body = JSON.parse(t); } catch { body = t; }
  return {status: res.status, body};
}

// status별 사용자 메시지 — 429(동시 실행 상한)·0(연결 실패)은 원본 JSON 대신 안내로.
function errorText(r) {
  const b = r.body || {};
  if (r.status === 0) return b.error || "서버에 연결할 수 없습니다";
  if (r.status === 429) return `서버가 혼잡합니다 — 동시 실행 상한(${b.limit ?? "?"}) 도달. 잠시 후 다시 시도하세요`;
  if (r.status === 404) return "에이전트를 찾을 수 없습니다";
  return b.error || (typeof b === "string" ? b : JSON.stringify(b));
}

// ── 렌더 ────────────────────────────────────────────────────────────────
function bubble(kind, who, html) {
  const m = document.createElement("div"); m.className = "msg " + kind;
  const av = {user:"🧑", bot:"🤖", err:"⚠️"}[kind] || "•";
  m.innerHTML = `<div class="av">${av}</div><div><div class="who">${who}</div><div class="bubble">${html}</div></div>`;
  log.appendChild(m); log.scrollTop = log.scrollHeight; return m;
}
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// state(dict)에서 최종 assistant 텍스트 + 호출 툴 추출. messages/result 형태를 모두 처리.
// invoke 결과의 result, stream 청크의 노드 업데이트({node: state}) 양쪽에서 재사용한다.
function readState(r) {
  if (!r || typeof r !== "object") return null;
  if (Array.isArray(r.messages)) {
    let text = null;
    for (let i = r.messages.length - 1; i >= 0; i--) {
      const m = String(r.messages[i]);
      const mm = m.match(/^content=(['"])([\s\S]*?)\1 additional_kwargs=/);   // 최종 AI 메시지
      if (mm && !/ name=(['"])/.test(m)) { text = unrepr(mm[2]); break; }      // 툴 결과(name=)는 제외
    }
    const tools = [...new Set([...String(r.messages.join("\n")).matchAll(/'name': '([^']+)'/g)].map(x => x[1]))];
    return {text, tools};
  }
  // 템플릿 등 다른 스키마: 흔한 출력 필드명을 순서대로 찾아 렌더 (SimpleAgent=answer 등)
  for (const key of ["result", "answer", "output", "response", "text"]) {
    if (typeof r[key] === "string") return {text: r[key], tools: []};
  }
  return null;
}
function readReply(body) {
  const s = readState(body.result || {});
  if (s) return {text: s.text ?? "(응답 텍스트 없음)", tools: s.tools};
  return {text: "```\n" + JSON.stringify(body.result, null, 2) + "\n```", tools: []};
}
const unrepr = s => s.replace(/\\n/g, "\n").replace(/\\'/g, "'").replace(/\\"/g, '"').replace(/\\\\/g, "\\");

function interruptOf(body) {
  const r = body && body.result;
  return (r && typeof r === "object" && Array.isArray(r.__interrupt__) && r.__interrupt__.length) ? r.__interrupt__[0] : null;
}
// payload(dict)를 라벨:값 목록으로 범용 렌더. 에이전트별 지식 없음 → HITL 추가돼도 프론트 무변경.
function renderFields(payload) {
  if (payload == null) return "";
  if (typeof payload !== "object") return `<div class="fld"><span class="v">${esc(String(payload))}</span></div>`;
  const entries = Object.entries(payload);
  if (!entries.length) return "";                 // 빈 payload({})는 휑한 빈 그리드 대신 생략
  const rows = entries.map(([k, v]) => {
    const disp = typeof v === "number" ? v.toLocaleString()
      : v && typeof v === "object" ? JSON.stringify(v) : String(v);
    return `<div class="fld"><span class="k">${esc(k)}</span><span class="v">${esc(disp)}</span></div>`;
  }).join("");
  return `<div class="fields">${rows}</div>`;
}

function renderResponse(agentId, r) {
  if (r.status !== 200) { bubble("err", agentId, esc(errorText(r))); return; }
  const pend = interruptOf(r.body);
  if (pend) { renderApproval(agentId, pend, false); return; }  // invoke로 시작 → 재개도 invoke
  const {text, tools} = readReply(r.body);
  const m = bubble("bot", agentId, esc(text));
  const box = m.querySelector(".bubble").parentElement;
  if (tools.length) box.insertAdjacentHTML("beforeend",
    `<div class="chips">${tools.map(t => `<span class="chip">🔧 ${esc(t)}</span>`).join("")}</div>`);
  box.insertAdjacentHTML("beforeend",
    `<details><summary>raw</summary><pre>${esc(JSON.stringify(r.body, null, 2))}</pre></details>`);
}

// streaming=true 면 재개도 스트리밍(/resume/stream), false 면 invoke(/resume) — 시작 방식과 일치시킨다.
function renderApproval(agentId, pend, streaming) {
  const v = (pend && pend.value) || {};          // {action, payload, approver, ...} — 서버가 구조 그대로 내려줌
  const tid = thread();  // 승인 대기 중 유저가 에이전트/유저를 바꿔도 원래 thread로 재개해야 한다
  const m = bubble("bot", agentId, "");
  const b = m.querySelector(".bubble"); b.classList.add("hitl");
  b.innerHTML = `<div class="head">🔔 ${esc(v.action || "승인 요청")}</div>
    ${renderFields(v.payload)}
    ${v.approver ? `<div class="who">승인자: ${esc(v.approver)}</div>` : ""}
    <div class="row"><input placeholder="반려 사유(선택)"></div>
    <div class="row"><button class="ok">승인</button><button class="no">반려</button></div>
    <details><summary>raw</summary><pre>${esc(JSON.stringify(v, null, 2))}</pre></details>`;
  const comment = b.querySelector("input");
  const decide = async approved => {
    if (busy) return;                        // 다른 요청 진행 중이면 승인 클릭 무시(중복 재개 방지)
    b.querySelectorAll("button, input").forEach(x => x.disabled = true);  // 한 번만 결정 가능(버튼·사유입력 잠금)
    const decision = {approved, comment: comment.value || null, decided_by: $("#xuser").value || "trader"};
    b.insertAdjacentHTML("beforeend", `<div class="done">→ ${approved ? "승인" : "반려"}됨</div>`);
    if (streaming) {
      await streamRequest(agentId, `/agents/${agentId}/resume/stream`, {thread_id: tid, decision});
    } else {
      setBusy(true);
      // 승인 후 재개는 검색·보고서로 수십 초 걸릴 수 있다 — 무반응처럼 보이지 않게 작성중 표시.
      const typing = bubble("bot", agentId, ""); typing.classList.add("typing");
      try {
        const r = await api(`/agents/${agentId}/resume`, {method:"POST", body: JSON.stringify({thread_id: tid, decision})});
        renderResponse(agentId, r);
      } finally { typing.remove(); setBusy(false); }
    }
  };
  b.querySelector(".ok").onclick = () => decide(true);
  b.querySelector(".no").onclick = () => decide(false);
}

// ── 입력 → invoke ─────────────────────────────────────────────────────────
function buildInput(agentId, text) {
  if (agentId === "stock") {
    // 관대한 파싱: 아무 데나 있는 숫자=수량, 숫자가 아닌 첫 토큰=종목. ("AAPL 10" / "애플 10주" 모두 OK)
    const num = text.match(/\d+/);
    const sym = text.split(/\s+/).find(w => w && !/^\d+주?$/.test(w));
    if (!num || !sym) {
      bubble("err", "stock", 'stock 에이전트는 <b>종목 수량</b> 형태로 입력하세요. 예: <b>AAPL 10</b>');
      return null;
    }
    return {symbol: sym.toUpperCase(), quantity: +num[0]};
  }
  return {messages: [{role: "user", content: text}]};
}

async function send(e) {
  e.preventDefault();
  if (busy) return;                           // 중복 제출 방지(연타 → 429·말풍선 뒤섞임)
  const agentId = $("#agent").value, text = $("#text").value.trim();
  if (!text && agentId !== "stock") return;   // stock은 빈칸도 buildInput이 형식 안내를 띄운다
  const input = buildInput(agentId, text); if (!input) return;
  bubble("user", "나", esc(text));
  clearText();
  const typing = bubble("bot", agentId, ""); typing.classList.add("typing");
  setBusy(true);
  try {
    const r = await api(`/agents/${agentId}/invoke`, {method:"POST", body: JSON.stringify({input, thread_id: thread()})});
    typing.remove();
    renderResponse(agentId, r);
  } finally {
    typing.remove();                          // 예외 경로에서도 typing 말풍선이 남지 않도록
    setBusy(false);
  }
}

// Stream 버튼 — 새 요청을 스트리밍.
async function stream() {
  if (busy) return;
  const agentId = $("#agent").value, text = $("#text").value.trim();
  if (!text && agentId !== "stock") return;
  const input = buildInput(agentId, text); if (!input) return;
  bubble("user", "나", esc(text)); clearText();
  await streamRequest(agentId, `/agents/${agentId}/stream`, {input, thread_id: thread()});
}

// 공통 스트리밍 렌더 — /stream 과 /resume/stream 이 공유. NDJSON(token/chunk/error)을 파싱해 실시간 갱신.
async function streamRequest(agentId, url, payload) {
  const m = bubble("bot", agentId, ""), box = m.querySelector(".bubble").parentElement;
  m.classList.add("typing");   // thinking: 첫 데이터가 오기 전까지 커서 표시
  const body = m.querySelector(".bubble");
  body.innerHTML = `<span class="chip">STREAM</span><span class="txt"></span>`;
  const txt = body.querySelector(".txt");
  const raw = document.createElement("details");
  raw.innerHTML = `<summary>raw</summary><pre></pre>`; box.appendChild(raw);
  const rawPre = raw.querySelector("pre");
  const tools = new Set();
  let errored = false, gotToken = false;
  const showTools = () => {
    box.querySelector(".chips")?.remove();
    if (tools.size) body.insertAdjacentHTML("beforeend",
      `<div class="chips">${[...tools].map(t => `<span class="chip">🔧 ${esc(t)}</span>`).join("")}</div>`);
  };

  const fail = msg => {
    errored = true;
    m.classList.remove("typing");
    body.querySelector(".chip")?.remove();
    body.insertAdjacentHTML("beforeend", `<div class="streamerr">⚠ ${esc(msg)}</div>`);
  };

  aborter = new AbortController();
  setBusy(true, true);                       // 스트림은 중지 가능
  let res;
  try { res = await fetch(url, {method:"POST", headers: headers(), body: JSON.stringify(payload), signal: aborter.signal}); }
  catch (e) { fail(e.name === "AbortError" ? "중지됨" : "서버에 연결할 수 없습니다"); aborter = null; setBusy(false); return; }
  if (!res.ok) {                             // 429 등 — 스트림 시작 전 거절
    let b = null; try { b = JSON.parse(await res.text()); } catch {}
    fail(errorText({status: res.status, body: b || {}}));
    aborter = null; setBusy(false); return;
  }

  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  const handle = line => {
    m.classList.remove("typing");   // 첫 데이터 도착 → thinking 해제
    rawPre.textContent += line + "\n";
    let obj; try { obj = JSON.parse(line); } catch { return; }
    if (obj.error) {                                  // 서버 에러 청크(가드레일/권한/오류)
      fail(obj.error.error || obj.error.state || "오류");   // error 문자열에 stage/guard가 이미 포함됨
      return;
    }
    if (typeof obj.token === "string") { gotToken = true; txt.textContent += obj.token; return; }  // LLM 토큰 델타
    const chunk = obj.chunk;
    if (!chunk || typeof chunk !== "object") return;
    // 각 노드 업데이트({node: state})를 순회 — interrupt면 승인 카드(재개도 스트리밍), 아니면 툴/텍스트 갱신.
    for (const val of Object.values(chunk)) {
      if (val && val.__interrupt__) { renderApproval(agentId, val.__interrupt__[0], true); continue; }
      const s = readState(val); if (!s) continue;
      if (s.text && !gotToken) txt.textContent = " " + s.text;  // 토큰 스트리밍이 없을 때만 최종 텍스트로 대체
      s.tools.forEach(t => tools.add(t)); showTools();
    }
    if (chunk.__interrupt__) renderApproval(agentId, chunk.__interrupt__[0], true);
  };
  try {
    for (;;) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true}); let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (line.trim()) handle(line);
        log.scrollTop = log.scrollHeight;
      }
    }
    if (buf.trim()) handle(buf);            // 개행 없이 끝난 마지막 줄
  } catch (e) {                             // 중지 또는 스트림 도중 연결 끊김
    fail(e.name === "AbortError" ? "중지됨" : "스트림이 끊겼습니다");
  } finally {
    m.classList.remove("typing"); aborter = null; setBusy(false);
  }
  if (!errored && !txt.textContent.trim()) txt.textContent = " (완료)";
}

// Resume — 중단된 스레드를 결정으로 재개. 텍스트 비면 승인, "반려/no…"면 반려(나머지는 사유).
function parseDecision(text) {
  const t = text.trim();
  if (!t) return {approved: true, decided_by: $("#xuser").value || "trader"};
  const rej = /^(반려|거절|no|reject|false)\b/i.exec(t);
  return {approved: !rej, comment: (rej ? t.slice(rej[0].length).trim() : t) || null, decided_by: $("#xuser").value || "trader"};
}
async function resume() {
  if (busy) return;
  const agentId = $("#agent").value, text = $("#text").value.trim();
  const decision = parseDecision(text);
  bubble("user", "나", `↩︎ resume: ${decision.approved ? "승인" : "반려"}${decision.comment ? " — " + esc(decision.comment) : ""}`);
  clearText();
  const typing = bubble("bot", agentId, ""); typing.classList.add("typing");
  setBusy(true);
  try {
    const r = await api(`/agents/${agentId}/resume`, {method:"POST", body: JSON.stringify({thread_id: thread(), decision})});
    renderResponse(agentId, r);
  } finally {
    typing.remove(); setBusy(false);
  }
}
// textarea 자동 높이. box-sizing:border-box 라 height에는 테두리도 포함되는데 scrollHeight에는
// 없다 — 그대로 대입하면 테두리 두께만큼 모자라 한 글자만 써도 스크롤바가 생긴다.
const MAX_TA = 140;
function autosize() {
  const t = $("#text");
  t.style.height = "auto";
  const border = t.offsetHeight - t.clientHeight;   // 위+아래 테두리 (padding은 scrollHeight에 포함됨)
  const need = t.scrollHeight + border;
  t.style.height = Math.min(need, MAX_TA) + "px";
  t.style.overflowY = need > MAX_TA ? "auto" : "hidden";  // 상한 넘을 때만 스크롤 허용
}
function clearText() { $("#text").value = ""; autosize(); }

// ── 부트 ───────────────────────────────────────────────────────────────
async function boot() {
  const r = await api("/agents");   // dot 은 api() 가 결과에 따라 up/down 갱신
  if (r.status !== 200 || !Array.isArray(r.body)) {
    $("#dot").className = "dot down";
    bubble("err", "system", "서버에 연결할 수 없습니다. 서버가 떠 있는지 확인하세요.");
    return;
  }
  $("#agent").innerHTML = r.body.map(a => `<option value="${a.id}">${a.id} — ${a.name || ""}</option>`).join("");
  setHint();
}
$("#composer").addEventListener("submit", send);
$("#stream").onclick = stream;
$("#resume").onclick = resume;
$("#stop").onclick = () => aborter?.abort();
$("#agent").onchange = setHint;
$("#newchat").onclick = () => { threadBase = "t-" + rnd(); log.innerHTML = ""; bubble("bot", "system", `새 대화 (${userId()})`); };
// X-User 변경 = 다른 유저의 세션으로 전환. 화면을 비워 이전 유저 대화가 섞이지 않게 한다.
// (서버는 각 유저 thread로 이력을 분리 보관하므로, 같은 유저로 돌아오면 이어진다.)
$("#xuser").onchange = () => { log.innerHTML = ""; bubble("bot", "system", `유저 전환: ${userId()} (독립 세션)`); };
$("#text").addEventListener("input", autosize);
window.addEventListener("resize", autosize);   // 창 너비가 바뀌면 줄바꿈이 달라져 높이도 달라진다
autosize();                                    // 초기 높이(붙여넣기 복원·기본값)도 맞춰둔다
// IME(한글/일본어/중국어) 조합 중 Enter는 '확정' Enter이므로 전송하지 않는다(마지막 글자 중복 방지).
$("#text").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(e); }
});
boot();
</script>
